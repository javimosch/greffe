<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>greffe explorer</title>
<style>
:root{--ink:#1c1a17;--muted:#5f5a52;--paper:#f7f3ea;--card:#fffdf8;--line:#e2d9c6;--green:#1f3a2e;--green2:#2f5a45;--accent:#b8541f;--ok:#2f7a4f;--bad:#a63a2b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--ink:#ece6d8;--muted:#a9a195;--paper:#15171a;--card:#1d2024;--line:#2e3238;--green:#8fc5a6;--green2:#6fa88a;--accent:#e08a5a;--ok:#7fcf9c;--bad:#e08a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,sans-serif}
a{color:var(--green2);text-decoration:none}a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);background:var(--card)}
.bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font:700 20px/1 Georgia,serif;color:var(--green);letter-spacing:-.02em}
.brand small{font:12px system-ui;color:var(--muted);margin-left:8px}
nav a{padding:6px 10px;border-radius:6px;color:var(--ink)}nav a.on{background:var(--green);color:var(--paper)}
main{max-width:1080px;margin:0 auto;padding:20px}
h2{font:600 18px/1.3 system-ui;margin:0 0 12px;color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card b{display:block;font-size:22px;color:var(--green);letter-spacing:-.02em}.card span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
code,.mono{font-family:var(--mono);font-size:13px}
.hash{font-family:var(--mono);font-size:12.5px;color:var(--green2)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--paper);border:1px solid var(--line)}
.pill.gov{border-color:var(--accent);color:var(--accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
input,select,button{font:14px system-ui;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--green);color:var(--paper);border-color:var(--green)}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.muted{color:var(--muted)}
.kv td:first-child{color:var(--muted);width:160px}
footer{max-width:1080px;margin:0 auto;padding:20px;color:var(--muted);font-size:13px}
</style></head><body>
<header><div class="bar"><div class="brand">greffe<small id="fed"></small></div>
<nav id="nav"><a href="#/">Overview</a><a href="#/blocks">Blocks</a><a href="#/entries">Entries</a><a href="#/governance">Governance</a><a href="#/pending">Pending</a><a href="#/peers">Peers</a><a href="#/verify">Verify</a></nav></div></header>
<main id="m">Loading…</main>
<footer>Read-only explorer served by this node. Everything shown comes from the same JSON API agents use: <code>/status /blocks /entries /pending /peers /verify</code>. Writes need a member key and go through the <code>greffe</code> CLI.</footer>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BASE=location.pathname.replace(/\/ui\/?$/,'').replace(/\/$/,'');
const j=async p=>{const r=await fetch(BASE+p);if(!r.ok)throw new Error(p+" -> "+r.status);return r.json()};
const ts=t=>new Date(t*1000).toISOString().replace("T"," ").replace(".000Z","Z");
const short=h=>`<a class="hash" title="${esc(h)}" href="#/entry/${esc(h)}">${esc(h.slice(0,12))}…</a>`;
const shortKey=k=>`<span class="hash" title="${esc(k)}">${esc(k.slice(0,12))}…</span>`;
const GOV=k=>/^(validator|member)\.(add|remove)$/.test(k);
const pill=k=>`<span class="pill${GOV(k)?" gov":""}">${esc(k)}</span>`;
let st=null;
async function status(){st=await j("/status");$("#fed").textContent=st.name+" · "+st.role+" · h"+st.height;return st}
function entryRows(es){return es.map(e=>`<tr><td><a href="#/block/${e.height}">${e.height<0?"pending":e.height}</a></td><td>${pill(e.kind)}</td><td>${shortKey(e.author)}</td><td class="mono">${esc(e.payload.length>120?e.payload.slice(0,120)+"…":e.payload)}</td><td class="muted">${ts(e.ts)}</td><td>${short(e.id)}</td></tr>`).join("")}
const entryTable=es=>`<table><tr><th>Block</th><th>Kind</th><th>Author</th><th>Payload</th><th>Time</th><th>Id</th></tr>${entryRows(es)||'<tr><td colspan="6" class="muted">nothing here</td></tr>'}</table>`;
const views={
 async "/"(){const s=await status();const bs=await j(`/blocks?from=${Math.max(0,s.height-9)}&limit=10`);const es=await j(`/entries?from=${Math.max(1,s.height-20)}&limit=1000`);
  return `<h2>${esc(s.name)}</h2><div class="cards">
  <div class="card"><b>${s.height}</b><span>height</span></div><div class="card"><b>${s.weight}</b><span>chain weight</span></div>
  <div class="card"><b>${s.validators.length}</b><span>validators</span></div><div class="card"><b>${s.members.length}</b><span>members</span></div>
  <div class="card"><b>${s.pending}</b><span>pending entries</span></div><div class="card"><b>${s.peers}</b><span>peers</span></div></div>
  <table class="kv"><tr><td>this node</td><td>${shortKey(s.pub)} · ${esc(s.role)}${s.nat?" (behind NAT)":""} · up ${Math.round(s.uptime/60)} min · v${esc(s.version)}</td></tr>
  <tr><td>genesis</td><td class="hash">${esc(s.genesis)}</td></tr><tr><td>tip</td><td class="hash">${esc(s.tip)}</td></tr>
  <tr><td>validators</td><td>${s.validators.map(v=>`<div class="hash">${esc(v)}</div>`).join("")}</td></tr>
  <tr><td>members</td><td>${s.members.map(v=>`<div class="hash">${esc(v)}</div>`).join("")||'<span class="muted">none yet</span>'}</td></tr></table>
  <h2 style="margin-top:22px">Latest entries</h2>${entryTable(es.reverse().slice(0,25))}
  <h2 style="margin-top:22px">Latest blocks</h2>${blockTable(bs.reverse())}`},
 async "/blocks"(q){const s=await status();const from=q.from!==undefined?+q.from:Math.max(0,s.height-24);const bs=await j(`/blocks?from=${from}&limit=25`);
  return `<h2>Blocks</h2><div class="tools"><a href="#/blocks?from=${Math.max(0,from-25)}">← older</a><a href="#/blocks?from=${Math.min(s.height,from+25)}">newer →</a></div>${blockTable(bs.reverse())}`},
 async "/block"(q,arg){const b=await j(`/blocks/${arg}`);const s=await status();
  return `<h2>Block ${b.height}</h2><table class="kv"><tr><td>hash</td><td class="hash">${esc(b.hash)}</td></tr><tr><td>previous</td><td>${b.height>0?`<a class="hash" href="#/block/${b.height-1}">${esc(b.prev)}</a>`:'<span class="muted">genesis</span>'}</td></tr>
  <tr><td>sealed by</td><td class="hash">${esc(b.signer)||'<span class="muted">—</span>'}</td></tr><tr><td>time</td><td>${ts(b.ts)}</td></tr><tr><td>confirmations</td><td>${s.height-b.height+1}</td></tr><tr><td>signature</td><td class="hash">${esc(b.sig)||"—"}</td></tr></table>
  <h2 style="margin-top:22px">${b.entries.length} entries</h2>${entryTable(b.entries.map(e=>({...e,height:b.height})))}`},
 async "/entries"(q){const s=await status();const kind=q.kind||"";const author=q.author||"";const from=q.from!==undefined?+q.from:Math.max(1,s.height-50);
  const es=await j(`/entries?from=${from}&limit=200&kind=${encodeURIComponent(kind)}&author=${encodeURIComponent(author)}`);
  return `<h2>Entries</h2><form class="tools" onsubmit="location.hash='#/entries?kind='+encodeURIComponent(this.kind.value)+'&author='+encodeURIComponent(this.author.value)+'&from=1';return false">
  <input name="kind" placeholder="kind (e.g. decision)" value="${esc(kind)}"><input name="author" placeholder="author public key" value="${esc(author)}" size="40"><button>Filter</button>
  <a style="align-self:center" href="#/entries?kind=${encodeURIComponent(kind)}&author=${encodeURIComponent(author)}&from=${Math.max(1,from-50)}">← older blocks</a></form>
  <p class="muted">from block ${from}, ${es.length} entries</p>${entryTable(es.reverse())}`},
 async "/governance"(){const es=await j(`/entries?from=1&limit=1000&kind=gov`);
  return `<h2>Governance</h2><p class="muted">Who was admitted or removed, by whom, and when. These are ordinary signed entries; only a validator may author them.</p>
  <table><tr><th>Block</th><th>Action</th><th>Subject key</th><th>By</th><th>Time</th></tr>${es.reverse().map(e=>`<tr><td><a href="#/block/${e.height}">${e.height}</a></td><td>${pill(e.kind)}</td><td class="hash">${esc(e.payload)}</td><td>${shortKey(e.author)}</td><td class="muted">${ts(e.ts)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">no governance entries yet</td></tr>'}</table>`},
 async "/pending"(){const es=await j("/pending");return `<h2>Pending</h2><p class="muted">Signed entries waiting for the next block.</p>${entryTable(es.map(e=>({...e,height:-1})))}`},
 async "/peers"(){const ps=await j("/peers");const s=await status();
  return `<h2>Peers</h2><p class="muted">${s.subscribers} NAT'd node(s) subscribed to this node.</p><table><tr><th>Address</th><th>Height</th><th>Weight</th><th>Last seen</th><th>Failures</th><th>Source</th></tr>${ps.map(p=>`<tr><td class="mono">${esc(p.addr)}</td><td>${p.height}</td><td>${p.weight}</td><td class="muted">${p.seen?ts(p.seen):"never"}</td><td>${p.fails}</td><td>${esc(p.source)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">no peers configured</td></tr>'}</table>`},
 async "/verify"(){return `<h2>Verify this node's record</h2><p>Re-checks every block hash, every block signature, every entry signature and every governance rule from genesis to the tip, on this node, right now.</p><button onclick="runVerify()">Verify from genesis</button><div id="vr" style="margin-top:14px"></div>`},
 async "/entry"(q,arg){const e=await j(`/entries/${arg}`);
  return `<h2>Entry</h2><table class="kv"><tr><td>id</td><td class="hash">${esc(e.id)}</td></tr><tr><td>kind</td><td>${pill(e.kind)}</td></tr><tr><td>author</td><td class="hash">${esc(e.author)}</td></tr><tr><td>time</td><td>${ts(e.ts)}</td></tr>
  <tr><td>block</td><td>${e.height<0?'<span class="muted">pending — not sealed yet</span>':`<a href="#/block/${e.height}">${e.height}</a> · ${e.confirmations} confirmation(s)`}</td></tr><tr><td>signature</td><td class="hash">${esc(e.sig)}</td></tr></table>
  <h2 style="margin-top:22px">Payload</h2><pre>${esc(pretty(e.payload))}</pre>`}
};
function pretty(p){try{return JSON.stringify(JSON.parse(p),null,2)}catch(_){return p}}
function blockTable(bs){return `<table><tr><th>Height</th><th>Hash</th><th>Entries</th><th>Sealed by</th><th>Time</th></tr>${bs.map(b=>`<tr><td><a href="#/block/${b.height}">${b.height}</a></td><td class="hash">${esc(b.hash.slice(0,16))}…</td><td>${b.entries.length}</td><td>${b.signer?shortKey(b.signer):'<span class="muted">genesis</span>'}</td><td class="muted">${ts(b.ts)}</td></tr>`).join("")}</table>`}
async function runVerify(){$("#vr").innerHTML='<span class="muted">verifying…</span>';try{const v=await j("/verify");$("#vr").innerHTML=v.ok?`<p class="ok">✔ valid — ${v.height+1} blocks, weight ${v.weight}, every hash and signature checks out.</p>`:`<p class="bad">✘ broken: ${esc(v.error)}</p>`}catch(e){$("#vr").innerHTML=`<p class="bad">${esc(e.message)}</p>`}}
async function route(){const h=location.hash.slice(1)||"/";const [path,qs]=h.split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));const seg=path.split("/");let view=views[path],arg;
 if(!view&&views["/"+seg[1]]){view=views["/"+seg[1]];arg=seg.slice(2).join("/")}
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+("/"+(seg[1]||""))||(path==="/"&&a.getAttribute("href")==="#/")));
 try{$("#m").innerHTML=await (view||views["/"])(q,arg)}catch(e){$("#m").innerHTML=`<p class="bad">${esc(e.message)}</p>`}}
addEventListener("hashchange",route);route();
</script></body></html>
